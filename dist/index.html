<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#315c49" />
    <!-- Same policy server.mjs sends as a header; static hosts such as GitHub
         Pages cannot set headers. Blocks any request to another origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Equilibrium" />
    <meta
      name="description"
      content="A little space between feeling and responding. Your personal reflection and emotional regulation companion."
    />
    <title>Equilibrium — A little more space</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog"></dialog>
  </body>
</html>
